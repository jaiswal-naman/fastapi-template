<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataComPredia: see data communication step by step</title>
    <meta name="description" content="Pick a topic, press Play and watch data communication happen step by step: topologies, routing, TCP and UDP, line coding and channel capacity." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#050911" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f1f5fa" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply theme before first paint to avoid a flash.
      (function () {
        try {
          var p = localStorage.getItem('dcp-theme') || 'system';
          var t = p === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : p;
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
